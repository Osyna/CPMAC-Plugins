<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quota Ledger</title>
<style>
/* Tokens copied from CPAMC src/styles/themes.scss so the iframe matches the host UI. */
:root {
  --bg-page: #faf9f5; --bg-card: #f0eee8; --bg-hover: #e9e6df; --track: #e3e1db;
  --text-1: #2d2a26; --text-2: #6d6760; --text-3: #a29c95;
  --border: #e3e1db; --border-strong: #d5d2cb;
  --green: #10b981; --yellow: #e0aa14; --red: #c65746; --warn: #a8710a;
  --btn-bg: #2d2a26; --btn-text: #ffffff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px -12px rgba(0, 0, 0, .12);
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
}
[data-theme='white'] { --bg-page: #ffffff; --bg-card: #ffffff; --bg-hover: #f6f6f6; --border: #e5e5e5; --border-strong: #d9d9d9; --track: #ececec; }
[data-theme='dark'] {
  --bg-page: #151412; --bg-card: #1d1b18; --bg-hover: #262320; --track: #3a3530;
  --text-1: #f6f4f1; --text-2: #c9c3bb; --text-3: #9c958d;
  --border: #3a3530; --border-strong: #4a453f;
  --yellow: #ffd862; --warn: #ffd862; --btn-bg: #f6f4f1; --btn-text: #151412;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px -14px rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg-page); color: var(--text-1); font-family: var(--sans); -webkit-font-smoothing: antialiased; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
main { padding: 32px clamp(20px, 3vw, 48px) 64px; max-width: 2200px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance; }
h2 { margin: 0; font-size: 16px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; }
.meta { margin-top: 8px; font-family: var(--mono); font-size: 15px; color: var(--text-2); border-left: 3px solid var(--green); padding-left: 14px; }
.meta .ok { color: var(--green); }
.actions { display: flex; gap: 10px; align-items: center; padding-top: 8px; }
.embedded .actions { margin-right: 170px; } /* clear CPAMC's floating toolbar over the iframe */
.btn { border: 1px solid var(--border-strong); background: transparent; border-radius: 999px; padding: 7px 16px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition-property: background-color, transform; transition-duration: 150ms; transition-timing-function: ease-out; }
.btn:hover { background: var(--bg-hover); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); font-weight: 600; }
.btn.small { padding: 4px 12px; font-size: 13px; }
.btn:disabled, .icon-btn:disabled { opacity: .5; cursor: default; }
.bar-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 22px; border-bottom: 1px solid var(--border); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 10px 14px 12px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition-property: color; transition-duration: 150ms; }
.tab:hover { color: var(--text-1); }
.tab.active { color: var(--text-1); border-bottom-color: var(--text-1); }
.count { font-family: var(--mono); font-size: 11px; font-weight: 500; background: var(--bg-hover); color: var(--text-2); border-radius: 999px; padding: 1px 7px; }
.icon { width: 18px; height: 18px; display: inline-flex; flex: none; }
.icon svg { width: 100%; height: 100%; }
select { font: inherit; font-size: 13px; color: var(--text-1); background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }
.muted { color: var(--text-3); font-size: 13px; }
.hint { color: var(--text-3); font-size: 12px; line-height: 1.5; }
.hint b { color: var(--text-2); font-weight: 600; }
.err { color: var(--red); font-size: 13px; }
.stale { color: var(--warn); font-size: 12px; }
.surface { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }

/* page grid: main column + sidebar on wide screens */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 24px; align-items: start; }
@media (min-width: 1240px) { .layout { grid-template-columns: minmax(0, 1fr) clamp(320px, 24vw, 400px); } }
.main-col, .side { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; line-height: 1.6; padding: 0 9px; border-radius: 999px; background: var(--bg-hover); color: var(--text-2); white-space: nowrap; }
.pill.dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--yellow) 20%, transparent); }
.pill.err { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
.pill.off { color: var(--text-3); }

/* provider overview cards */
.overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.pcard { position: relative; overflow: hidden; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; container-type: inline-size; }
.pcard::before, .acard::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--accent); opacity: .85; }
.pc-head { display: flex; justify-content: space-between; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.pc-name { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; }
.pc-name small { font-weight: 400; font-size: 13px; color: var(--text-3); white-space: nowrap; }
.pc-hero { display: flex; align-items: center; gap: 18px; }
.pc-hero-text { min-width: 0; flex: 1; }
.donut { flex: none; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.hero-num { font-size: 34px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.hero-num span { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--text-2); margin-left: 6px; }
.sub { font-size: 13px; color: var(--text-2); margin-top: 2px; text-wrap: pretty; }
.segments { display: flex; gap: 4px; margin-top: 10px; }
.seg { flex: 1; height: 5px; background: var(--track); border-radius: 3px; overflow: hidden; }
.pc-list { list-style: none; margin: 0; padding: 14px 0 0; border-top: 1px solid var(--border); display: grid; gap: 10px; }
.pc-list li { display: grid; grid-template-columns: minmax(70px, 1.4fr) minmax(32px, 1fr) 40px auto; align-items: center; gap: 10px; font-size: 13px; }
.pc-list li.cap { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.pc-list .lbl { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-list .pct { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.pc-list .when { text-align: right; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.minibar, .track { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.minibar > i, .track > i, .seg > i { display: block; height: 100%; border-radius: inherit; transition: width 300ms ease-out; }
.money { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 13px; }
.money-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.money-row .lbl { flex: 1 0 auto; color: var(--text-2); }
.money-row b { font-variant-numeric: tabular-nums; }
.issue { font-size: 13px; color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); border-radius: 10px; padding: 8px 12px; text-wrap: pretty; }
.issue.wait { color: var(--warn); background: color-mix(in srgb, var(--yellow) 12%, transparent); }
.issue.relogin { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.issue.relogin .btn { color: var(--text-1); }

/* lost at reset */
.ws-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-page); }
.ws-main { min-width: 0; display: grid; gap: 4px; }
.ws-bars { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
.ws-bars i { width: 8px; border-radius: 2px; background: repeating-linear-gradient(-45deg, var(--warn) 0 3px, color-mix(in srgb, var(--warn) 45%, transparent) 3px 6px); }

/* alerts, rules, integrations */
.x-btn { border: 0; background: none; color: var(--text-3); font-size: 16px; line-height: 1; width: 24px; height: 24px; border-radius: 6px; }
.x-btn:hover { background: var(--bg-hover); color: var(--text-1); }
.rules ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; color: var(--text-2); }
.rules li.on { color: var(--text-1); }
.snip { margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: var(--bg-page); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; color: var(--text-2); }
.bar-preview { font-family: var(--mono); font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 10px; background: var(--bg-page); border: 1px solid var(--border); }
.bar-preview.warning { color: var(--warn); }
.bar-preview.critical { color: var(--red); }

/* use first: where unused quota is lost at reset */
.uf { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.uf header { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
.uf h2 { margin: 0; font-size: 16px; }
.uf-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 10px; }
.uf-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-page); }
.uf-row.first { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.uf-rank { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--bg-hover); color: var(--text-2); }
.uf-row.first .uf-rank { background: var(--accent); color: #fff; }
.uf-main { min-width: 0; display: grid; gap: 4px; }
.uf-title { display: flex; align-items: center; gap: 8px; font-weight: 650; flex-wrap: wrap; }
.uf-title small { font-weight: 400; color: var(--text-3); font-size: 12.5px; }
.uf-sub { font-size: 13px; color: var(--text-2); text-wrap: pretty; }
.uf-more { font-size: 12px; color: var(--text-3); }
.uf-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--track); margin: 4px 0 2px; }
.uf-bar i { display: block; height: 100%; }
.uf-bar .u { background: color-mix(in srgb, var(--text-3) 55%, transparent); }
.uf-bar .p { background: var(--green); opacity: .7; }
.uf-bar .l { background: repeating-linear-gradient(-45deg, var(--warn) 0 3px, color-mix(in srgb, var(--warn) 45%, transparent) 3px 6px); }
.uf-big { text-align: right; white-space: nowrap; }
.uf-big b { display: block; font-size: 22px; font-weight: 750; color: var(--warn); font-variant-numeric: tabular-nums; line-height: 1.1; }
.uf-big span { font-size: 12px; color: var(--text-3); }
.uf-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); }
.uf-key i { display: inline-block; width: 10px; height: 6px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.uf-part { display: grid; grid-template-columns: 76px minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: 12px; color: var(--text-3); }
.uf-part .uf-bar { margin: 0; }
.uf-part span:last-child { text-align: right; }

/* account cards */
.accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.acard { position: relative; overflow: hidden; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.ac-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.ac-id { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.ac-icon { width: 34px; height: 34px; padding: 7px; border-radius: 10px; background: var(--bg-hover); display: inline-flex; flex: none; }
.ac-icon svg { width: 100%; height: 100%; }
.ac-name { font-family: var(--mono); font-weight: 700; font-size: 14px; word-break: break-all; }
.ac-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 6px; font-size: 12px; }
.ac-actions { display: flex; gap: 8px; align-items: center; flex: none; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-2); transition-property: background-color, color, transform; transition-duration: 150ms; transition-timing-function: ease-out; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text-1); }
.icon-btn:active { transform: scale(0.94); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.tile { background: var(--bg-page); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.t-top { font-size: 12.5px; color: var(--text-2); }
.t-mid { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.t-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-num { font-size: 24px; font-weight: 750; letter-spacing: -0.01em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.t-num span { font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--text-3); margin-left: 4px; }
.t-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); min-height: 20px; white-space: nowrap; }
.t-foot b { color: var(--text-2); font-weight: 500; }
.spark { display: block; flex: none; }
.chip-pace { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.chip-pace.warn { color: var(--warn); background: color-mix(in srgb, var(--yellow) 20%, transparent); }
.chip-pace.low { color: var(--text-3); background: var(--bg-hover); }
.proj { font-size: 12px; color: var(--warn); }
.ac-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--text-2); padding-top: 12px; border-top: 1px solid var(--border); }
.ac-foot .note { color: var(--text-1); }

/* sidebar cards */
.side-card { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.side-card > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lead { margin: 0; font-size: 14px; line-height: 1.55; text-wrap: pretty; }
.fact { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--text-2); text-wrap: pretty; }
.fact svg { flex: none; margin-top: 2px; color: var(--text-3); }
.fact b { color: var(--text-1); font-weight: 600; }
.note-box { font-size: 13px; line-height: 1.5; color: var(--text-2); background: var(--bg-hover); border-radius: 10px; padding: 10px 12px; text-wrap: pretty; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--bg-page); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text-3); }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .icon { width: 16px; height: 16px; }
.list small { display: block; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .plus { color: var(--green); font-weight: 700; font-variant-numeric: tabular-nums; }
.list .time { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.event-dot { width: 8px; height: 8px; border-radius: 50%; justify-self: center; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* usage */
.usage-card { padding: 18px 20px; }
.seg-ctl { display: inline-flex; padding: 3px; background: var(--bg-hover); border-radius: 10px; }
.seg-ctl button { border: 0; background: transparent; padding: 4px 12px; border-radius: 8px; font-size: 13px; color: var(--text-2); transition-property: background-color, color; transition-duration: 150ms; }
.seg-ctl button.on { background: var(--bg-card); color: var(--text-1); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
table.usage { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.usage th, table.usage td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; }
table.usage th { color: var(--text-3); font-weight: 500; font-size: 12px; }
table.usage .n { text-align: right; font-family: var(--mono); white-space: nowrap; }
table.usage tr.l0 td { font-weight: 700; font-family: var(--mono); padding-top: 14px; }
table.usage tr.l1 td:first-child { padding-left: 26px; font-family: var(--mono); }
table.usage tr.l2 td:first-child { padding-left: 48px; color: var(--text-2); font-family: var(--mono); }
.table-wrap { overflow-x: auto; }

.empty { padding: 32px; border: 1px dashed var(--border-strong); border-radius: 16px; color: var(--text-2); }
.login { margin-top: 40px; max-width: 420px; padding: 24px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg-card); }
.login input { width: 100%; margin: 12px 0; padding: 9px 12px; font: inherit; color: var(--text-1); background: var(--bg-page); border: 1px solid var(--border-strong); border-radius: 10px; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* narrow provider cards: smaller gauge, drop the mini bars so label/left/resets always fit */
@container (max-width: 300px) {
  .pc-list li { grid-template-columns: minmax(0, 1fr) 40px auto; }
  .pc-list .minibar, .pc-list li.cap > span:nth-child(2) { display: none; }
  .pc-hero { gap: 14px; }
  .hero-num { font-size: 28px; }
}
@media (max-width: 700px) { .embedded .actions { margin-right: 0; } }
</style>
</head>
<body>
<main id="app"></main>
<script>

function relative(ms) {
  const diff = ms - Date.now();
  if (diff <= 0) return 'now';
  const min = Math.round(diff / 60000);
  if (min < 60) return `in ${min} min`;
  const hours = Math.round(min / 60);
  if (hours < 24) return `in ${hours} hour${hours === 1 ? '' : 's'}`;
  const days = Math.round(hours / 24);
  return `in ${days} day${days === 1 ? '' : 's'}`;
}
function ago(ms) {
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min} min ago`;
  const hours = Math.round(min / 60);
  return hours < 24 ? `${hours} h ago` : `${Math.round(hours / 24)} d ago`;
}
const absolute = (ms) => {
  const d = new Date(ms);
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

}

function money(currency, n, decimals) {
  const digits = decimals ?? (Number.isInteger(n) ? 0 : 2);
  try {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency || 'USD', minimumFractionDigits: digits, maximumFractionDigits: 2 }).format(n);
  } catch {
    return `${n.toFixed(digits)} ${currency}`; // unknown currency code
  }
}
// Sum one money field (spend | credits) over credentials, per currency.
function moneyTotals(creds, field) {
  const by = {};
  for (const c of creds) {
    const m = c[field];
    if (!m) continue;
    const t = (by[m.currency] ??= { currency: m.currency, used: 0, limit: 0, left: 0, reached: 0, off: 0 });
    t.used += m.used || 0;
    t.limit += m.limit || 0;
    t.left += m.remaining ?? Math.max(0, (m.limit || 0) - (m.used || 0));
    t.reached += m.limit_reached ? 1 : 0;
    t.off += m.enabled === false ? 1 : 0;
  }
  return Object.values(by);
}
function moneyRows(creds) {
  const rows = [
    ...moneyTotals(creds, 'spend').map((t) => `<div class="money-row"><span class="lbl" title="Pay-as-you-go usage billed after the plan limits run out">Extra usage</span><span><b>${money(t.currency, t.used, 2)}</b> of ${money(t.currency, t.limit, 2)}</span>${t.reached ? '<span class="pill err">cap reached</span>' : t.off ? '<span class="pill off">off</span>' : ''}</div>`),
    ...moneyTotals(creds, 'credits').map((t) => `<div class="money-row"><span class="lbl" title="Dollar credit pool; an empty pool does not block normal plan usage">Session credits</span><span><b>${money(t.currency, t.left)}</b> of ${money(t.currency, t.limit)} left</span>${t.left <= 0 ? '<span class="pill off">used up</span>' : ''}</div>`),
  ];
  return rows.length ? `<div class="money">${rows.join('')}</div>` : '';
}

// Share of the window already elapsed vs share of quota used; >1 means burning faster than time passes.
function pace(w, now = Date.now()) {
  if (w.used == null || !w.reset_at || !w.period_s || w.reset_at <= now) return null;
  const elapsed = 1 - (w.reset_at - now) / (w.period_s * 1000);
  if (elapsed < 0.05) return null; // too early in the window for a stable ratio
  const ratio = Math.round((w.used / (Math.min(elapsed, 1) * 100)) * 1e3) / 1e3; // kills float noise at the 0.5/1.2 edges
  return { elapsed, ratio, tone: ratio >= 1.2 ? 'warn' : ratio <= 0.5 ? 'low' : null };
}

// Linear fit of used% over the last <=24 h of the current window; returns the projected 100% time
// only when it falls before reset_at. shortcut: ordinary least squares, no outlier handling.
function project(points, w, now = Date.now()) {
  if (!points || w.used == null || w.used >= 100 || !w.reset_at || w.reset_at <= now) return null;
  let cut = now - 24 * HOUR;
  if (w.period_s) cut = Math.max(cut, w.reset_at - w.period_s * 1000);
  let pts = points.filter((p) => p[0] >= cut && p[1] != null);
  for (let i = pts.length - 1; i > 0; i--) {
    if (pts[i][1] < pts[i - 1][1] - 1) { pts = pts.slice(i); break; } // usage fell: a reset, ignore what came before
  }
  if (pts.length < 2 || pts[pts.length - 1][0] - pts[0][0] < 5 * 60e3) return null;
  const t0 = pts[0][0];
  const xs = pts.map((p) => (p[0] - t0) / HOUR);
  const ys = pts.map((p) => p[1]);
  const mx = xs.reduce((a, b) => a + b, 0) / xs.length;
  const my = ys.reduce((a, b) => a + b, 0) / ys.length;
  const sxx = xs.reduce((a, x) => a + (x - mx) ** 2, 0);
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / sxx;
  if (!(slope > 0)) return null;
  const hit = Math.max(now, t0 + ((100 - (my - slope * mx)) / slope) * HOUR);
  return hit < w.reset_at ? hit : null;
}

// Upcoming resets, soonest first; `restore` is the used% that comes back.
function timeline(creds, now = Date.now()) {
  const out = [];
  for (const c of creds) {
    for (const w of c.windows || []) {
      if (w.used > 0 && w.reset_at > now) out.push({ at: w.reset_at, restore: Math.round(w.used), provider: c.provider, label: w.label, name: c.name, email: c.email });
    }
  }
  return out.sort((a, b) => a.at - b.at);
}

// Use it or lose it: quota still unused when a window resets is gone. Projected at the window's
// average pace so far (once >=10% of it has elapsed), else assuming no further use.
const isLong = (w, now) => (w.period_s ? w.period_s >= 86400 : w.reset_at - now > 24 * HOUR);
function lossOf(c, w, now) {
  if (w.key === 'credits' || w.used == null || !(w.reset_at > now)) return null;
  const pc = pace(w, now);
  const paced = Boolean(pc && pc.elapsed >= 0.1);
  const lost = paced ? clamp(100 - w.used / pc.elapsed) : remaining(w);
  if (lost < 5) return null;
  // Another (unscoped) window at ~0% blocks this one until it resets.
  const after = c.windows
    .filter((v) => v !== w && v.key !== 'credits' && !v.key.startsWith('scoped:') && remaining(v) !== null && remaining(v) < 1 && v.reset_at > now)
    .sort((a, b) => b.reset_at - a.reset_at)[0] || null;
  if (after && after.reset_at >= w.reset_at) return null; // lost whatever you do
  return { w, lost, paced, after };
}
// Accounts in spending order: earliest-expiring day+ budget first (earliest deadline first wastes least),
// accounts with only short (e.g. 5-hour) windows at risk after them.
function usePlan(creds, now) {
  const rows = [];
  for (const c of creds) {
    if (c.disabled || !c.windows?.length) continue;
    const risks = c.windows.map((w) => lossOf(c, w, now)).filter(Boolean)
      // Model caps (scoped:*) sit inside the all-models window: headline the global one, show caps beside it.
      .sort((a, b) => isLong(b.w, now) - isLong(a.w, now) || a.w.key.startsWith('scoped:') - b.w.key.startsWith('scoped:') || a.w.reset_at - b.w.reset_at);
    if (risks.length) rows.push({ c, top: risks[0], rest: risks.slice(1) });
  }
  return rows.sort((a, b) => isLong(b.top.w, now) - isLong(a.top.w, now) || a.top.w.reset_at - b.top.w.reset_at);
}

// The dollar credit pool ("credits") is excluded: an empty pool does not block plan usage.
function belowCount(creds, threshold) {
  let n = 0;
  for (const c of creds) if (!c.disabled) for (const w of c.windows || []) if (w.key !== 'credits' && w.used != null && 100 - w.used < threshold) n++;

}

const USAGE_FIELDS = ['requests', 'failed', 'input_tokens', 'output_tokens', 'cache_read_tokens', 'cache_creation_tokens'];
const zero = () => Object.fromEntries(USAGE_FIELDS.map((f) => [f, 0]));
const addTo = (t, r) => { for (const f of USAGE_FIELDS) t[f] += r[f] || 0; };
// credential -> client key -> model, each level carrying its totals, busiest first.
function groupUsage(rows) {
  const root = new Map();
  const child = (map, key, leaf) => {
    if (!map.has(key)) map.set(key, { key, t: zero(), kids: leaf ? null : new Map() });
    return map.get(key);
  };
  for (const r of rows) {
    const a = child(root, r.auth_index, false);
    const c = child(a.kids, r.client_key || '—', false);
    const m = child(c.kids, r.model || '—', true);
    for (const n of [a, c, m]) addTo(n.t, r);
  }
  const sorted = (map) => [...map.values()].sort((x, y) => y.t.requests - x.t.requests);
  return sorted(root).map((a) => ({ ...a, kids: sorted(a.kids).map((c) => ({ ...c, kids: sorted(c.kids) })) }));
}

/* ---------- management key ---------- */

// CPAMC persists its auth store with reversible XOR obfuscation (src/utils/encryption.ts): enc::v2 salts
// with the host, the older enc::v1 also with the user agent.
// The key is only present when "remember password" was checked at login.
function cpamcKey() {
  try {
    const raw = localStorage.getItem('cli-proxy-auth');
    if (!raw) return null;
    let text = raw;
    const v = /^enc::v([12])::/.exec(raw);
    if (v) {
      const salt = new TextEncoder().encode(`cli-proxy-api-webui::secure-storage|${location.host}${v[1] === '1' ? `|${navigator.userAgent}` : ''}`);
      const bin = atob(raw.slice(v[0].length));
      text = new TextDecoder().decode(Uint8Array.from(bin, (c, i) => c.charCodeAt(0) ^ salt[i % salt.length]));
    }
    const parsed = JSON.parse(text);
    return (parsed.state || parsed).managementKey || null;
  } catch {
    return null;
  }
}

class AuthError extends Error {}

async function mgmt(path, body, method = body ? 'POST' : 'GET') {
  const res = await fetch(path, {
    method,
    headers: { Authorization: `Bearer ${state.key}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) throw new AuthError('Management key rejected');
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

// Host-proxied upstream call (used by reset-credit actions only).
async function upstream(authIndex, method, url, header, data) {
  const res = await mgmt('/v0/management/api-call', { auth_index: authIndex, method, url, header, ...(data ? { data } : {}) });
  let body = res.body;
  if (typeof body === 'string') {
    try { body = JSON.parse(body); } catch { /* keep text */ }
  }
  return { status: num(res.status_code) ?? 0, body };
}

function requireKey() {
  sessionStorage.removeItem('quota-ledger:key');
  state.key = null;
  state.needKey = true;
  render();
}

/* ---------- loading ---------- */

async function loadState(path = 'state', body) {
  try {
    state.snap = await mgmt(API + path, body);
    state.loadError = state.fetchError = '';
  } catch (err) {
    if (err instanceof AuthError) return requireKey();
    const msg = err.message || String(err);
    if (state.snap) state.fetchError = msg;
    else state.loadError = /HTTP 404/.test(msg) ? `${msg} — is the quota-ledger plugin loaded?` : msg;
  }
  render();
}

async function loadHistory() {
  try {
    const { series = [] } = await mgmt(`${API}history?hours=168`);
    state.history = Object.fromEntries(series.map((s) => [`${s.auth_index}|${s.key}`, s.points]));
    state.historyAt = Date.now();
  } catch (err) {
    if (err instanceof AuthError) return requireKey();
  }
  render();
}

async function loadUsage() {
  const hours = state.usageHours;
  try {
    const data = await mgmt(`${API}usage?hours=${hours}`);
    if (hours === state.usageHours) state.usage = { hours, ...data };
  } catch (err) {
    if (err instanceof AuthError) return requireKey();
  }
  render();
}

const eventKey = (e) => `${e.at}|${e.kind}|${e.auth_index}|${e.window}`;

function notify(e) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(`Quota Ledger · ${e.kind}`, { body: e.message || `${e.name} ${e.label}`, tag: eventKey(e) }); } catch { /* unsupported context */ }
}

async function loadAlerts() {
  try {
    const { events = [] } = await mgmt(`${API}alerts?since=${state.alertsAt}`);
    const fresh = events.filter((e) => !state.seen.has(eventKey(e)));
    for (const e of fresh) state.seen.add(eventKey(e));
    state.alerts = [...state.alerts, ...fresh].slice(-200);
    for (const e of events) state.alertsAt = Math.max(state.alertsAt, e.at);
    if (state.alertsReady) fresh.filter((e) => NOTIFY_KINDS.has(e.kind) && !e.muted).forEach(notify);
    state.alertsReady = true;
  } catch (err) {
    if (err instanceof AuthError) return requireKey();
  }
  render();
}

async function refreshAll() {
  state.refreshing = true;
  render();
  state.resets = {};
  await loadState('refresh', {});
  state.refreshing = false;
  render();
  loadHistory();
  loadResets();
}

async function refreshOne(c) {
  state.busy.add(c.auth_index);
  render();
  await loadState('refresh', { auth_index: c.auth_index });
  state.busy.delete(c.auth_index);
  render();
}

async function loadWaste() {
  try {
    const { events = [] } = await mgmt(`${API}waste?days=56`);
    state.waste = events;
  } catch (err) {
    if (err instanceof AuthError) return requireKey();

  render();
}

async function loadBar() {
  try {
    state.bar = await mgmt(`${API}bar`);
  } catch (err) {
    if (err instanceof AuthError) return requireKey();
  }
  render();
}

async function loadAll() {
  await loadState();
  if (!state.snap) return;
  loadAlerts();
  loadHistory();
  loadUsage();
  loadWaste();
  loadBar();
  loadResets();
}

async function tick() {
  if (document.hidden || state.needKey || !state.key) return;
  await loadState();
  loadAlerts();
  loadResets();
  loadBar();
  if (Date.now() - state.historyAt >= SLOW_POLL_MS) { loadHistory(); loadUsage(); loadWaste(); }
}

async function setMuted(c, muted) {
  try {
    state.snap = await mgmt(`${API}mute`, { auth_index: c.auth_index, muted });
  } catch (err) {
    if (err instanceof AuthError) return requireKey();
    state.notes[c.auth_index] = err.message;
  }
  render();
}

// Disabling goes through CPA's own auth-file switch, the same one the Auth Files page uses.
async function turnOff(c) {
  if (!confirm(`Turn off ${maskEmail(c.name, c.email)}? Requests stop using it until you turn it back on in Auth Files.`)) return;
  state.busy.add(c.auth_index);
  render();
  try {
    await mgmt('/v0/management/auth-files/status', { name: c.name, disabled: true }, 'PATCH');
    state.notes[c.auth_index] = 'Turned off.';
  } catch (err) {
    if (err instanceof AuthError) return requireKey();
    state.notes[c.auth_index] = `Could not turn it off: ${err.message}`;
  }
  state.busy.delete(c.auth_index);
  await loadState('refresh', { auth_index: c.auth_index });
