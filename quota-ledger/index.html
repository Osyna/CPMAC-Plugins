// CPAMC pages live in its hash router; open them in the parent window when embedded.
function openCpamc(route) {
  const target = window.parent !== window ? window.parent : window;
  if (target === window) location.href = `/management.html#/${route}`;
  else target.location.hash = `#/${route}`;
}

async function dismiss(key) {
  const all = key === '*';
  const e = state.alerts.find((x) => eventKey(x) === key);
  try {
    await mgmt(`${API}alerts/dismiss`, all ? { all: true } : { at: e.at, kind: e.kind, auth_index: e.auth_index, window: e.window });
    state.alerts = all ? [] : state.alerts.filter((x) => x !== e);
  } catch (err) {
    if (err instanceof AuthError) return requireKey();
    state.webhookNote = err.message;
  }
  render();
}

/* ---------- reset credits (feature 10; CPAMC features/quota/providers/{claude,codex}) ---------- */

const GRANT_ID_RE = /^[a-z0-9_-]{1,40}$/;
const ORG_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const CLAIM_RESULTS = ['reset', 'already_used', 'not_limited', 'cooldown', 'ineligible', 'unavailable'];
const isCount = (v) => Number.isInteger(v) && v >= 0;
const optTime = (v) => (v == null ? null : typeof v === 'string' && !Number.isNaN(Date.parse(v)) ? v : undefined);
const optBool = (v, fallback) => (v == null ? fallback : typeof v === 'boolean' ? v : undefined);

function parseGrant(g) {
  if (!isRec(g) || typeof g.id !== 'string' || !GRANT_ID_RE.test(g.id) || !isCount(g.resets_total) || !isCount(g.resets_left) || g.resets_left > g.resets_total) return null;
  // Missing usability flags default to the refusing side, like CPAMC.
  const grant = { id: g.id, left: g.resets_left, startsAt: optTime(g.starts_at), endsAt: optTime(g.ends_at), paused: optBool(g.paused, false), usableNow: optBool(g.usable_now, false), needsLimit: optBool(g.use_requires_limit, true) };
  return Object.values(grant).includes(undefined) ? null : grant;
}

// Parses the `cedar_ember` block; null when missing or malformed.
function parseGrantStatus(b) {
  if (!isRec(b) || typeof b.eligible !== 'boolean') return null;
  const raw = b.grants ?? [];
  if (!Array.isArray(raw)) return null;
  const grants = [];
  const seen = new Set();
  for (const r of raw) {
    const g = parseGrant(r);
    if (!g || seen.has(g.id)) return null;
    seen.add(g.id);
    grants.push(g);
  }
  const atLimit = optBool(b.at_limit, false);
  const cooldownUntil = optTime(b.cooldown_until);
  if (atLimit === undefined || cooldownUntil === undefined) return null;
  return { eligible: b.eligible, atLimit, grants, cooldownUntil, nextGrantId: typeof b.next_grant_id === 'string' && seen.has(b.next_grant_id) ? b.next_grant_id : null };
}

function grantBlocker(s, id) {
  if (!s.eligible) return 'ineligible';
  const g = s.grants.find((x) => x.id === id);
  if (!g) return 'unknown_grant';
  if (g.paused) return 'paused';
  if (!g.usableNow) return 'not_usable';
  if (g.left <= 0) return 'exhausted';
  if (g.needsLimit && !s.atLimit) return 'not_limited';
  return null;
}

// Prefer the upstream recommendation; otherwise stable id order.
function selectGrant(s, now = Date.now()) {
  if (s.cooldownUntil && Date.parse(s.cooldownUntil) > now) return undefined;
  const usable = s.grants.filter((g) => !grantBlocker(s, g.id) && (!g.startsAt || Date.parse(g.startsAt) <= now) && (!g.endsAt || Date.parse(g.endsAt) > now));
  return usable.find((g) => g.id === s.nextGrantId) ?? usable.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0))[0];
}

async function readAccount(authIndex, path) {
  const r = await upstream(authIndex, 'GET', ANTHROPIC + path, CLAUDE_HEADERS);
  if (r.status === 401 || r.status === 403) throw new Error('auth_error');
  if (r.status === 429) throw new Error('rate_limited');
  if (r.status < 200 || r.status >= 300 || !isRec(r.body)) throw new Error('upstream');
  return r.body;
}
async function readGrants(authIndex) {
  const status = parseGrantStatus((await readAccount(authIndex, '/api/oauth/usage?cedar_ember=1&skip_spend=1')).cedar_ember);
  if (!status) throw new Error('malformed');
  return status;
}
async function readOrg(authIndex) {
  const uuid = (await readAccount(authIndex, '/api/oauth/profile')).organization?.uuid;
  if (typeof uuid !== 'string' || !ORG_RE.test(uuid)) throw new Error('malformed');
  return uuid.toLowerCase();
}

// Spends one Claude reset grant. An ambiguous outcome keeps its request id in state.ops so a retry
// inside RETRY_WINDOW_MS cannot double-spend.
async function claimClaude(c) {
  const ai = c.auth_index;
  let op = state.ops[ai];
  if (op?.code) op = undefined;
  if (op && Date.now() - op.createdAt >= RETRY_WINDOW_MS) throw new Error('expired');
  const wasRetry = Boolean(op);
  const org = await readOrg(ai);
  if (op && op.org !== org) throw new Error('identity');
  if (!op) {
    const grant = selectGrant(await readGrants(ai));
    if (!grant) throw new Error('blocked');
    op = state.ops[ai] = { grantId: grant.id, org, requestId: uuid(), createdAt: Date.now() };
  }
  let code;
  try {
    const r = await upstream(ai, 'POST', `${ANTHROPIC}/api/organizations/${org}/reset_rate_limits`, CLAUDE_HEADERS, JSON.stringify({ program: 'cedar_ember', grant_id: op.grantId, request_id: op.requestId }));
    if (r.status === 429) code = 'rate_limited';
    else if (r.status === 401 || r.status === 403) code = 'auth_error';
    else if (r.status >= 200 && r.status < 300 && isRec(r.body) && CLAIM_RESULTS.includes(r.body.result)) code = r.body.result;
  } catch (err) {
    if (err instanceof AuthError) throw err;
  }
  if (!code) throw new Error('unknown'); // the proxy may have sent the claim anyway
  // A refusal on a retry cannot prove the earlier ambiguous POST did not spend.
  if (!wasRetry || code === 'reset' || code === 'already_used') op.code = code;
  return op.code ? code : 'unknown';
}

async function accountId(authIndex) {
  if (!state.accountIds) {
    const { files = [] } = await mgmt('/v0/management/auth-files');
    state.accountIds = Object.fromEntries(files.map((f) => [f.auth_index, f.id_token?.chatgpt_account_id || '']));
  }
  return state.accountIds[authIndex] || '';
}
async function codexHeaders(authIndex) {
  const id = await accountId(authIndex);
  return id ? { ...CODEX_HEADERS, 'Chatgpt-Account-Id': id } : { ...CODEX_HEADERS };
}

async function readCodexCredits(c) {
  const header = { ...(await codexHeaders(c.auth_index)), Accept: 'application/json', 'OpenAI-Beta': 'codex-1', Originator: 'Codex Desktop' };
  const r = await upstream(c.auth_index, 'GET', CODEX_CREDITS_URL, header);
  if (r.status < 200 || r.status >= 300) throw new Error(`HTTP ${r.status}`);
  if (!isRec(r.body) || !['credits', 'available_count', 'availableCount'].some((k) => k in r.body)) throw new Error('invalid payload');
  const expires = (Array.isArray(r.body.credits) ? r.body.credits : [])
    .filter((x) => isRec(x) && (x.reset_type ?? x.resetType) === 'codex_rate_limits' && x.status === 'available')
    .map((x) => Date.parse(x.expires_at ?? x.expiresAt))
    .filter(Number.isFinite);
  return { count: num(r.body.available_count ?? r.body.availableCount) ?? (expires.length || null), expires: expires.length ? Math.min(...expires) : null };
}

async function readResets(c) {
  try {
    if (c.provider === 'codex') return { at: Date.now(), ...(await readCodexCredits(c)) };
    const s = await readGrants(c.auth_index);
    return { at: Date.now(), count: s.grants.reduce((n, g) => n + g.left, 0), grant: selectGrant(s)?.id ?? null };
  } catch (err) {
    if (err instanceof AuthError) throw err;
    return { at: Date.now(), error: err.message };
  }
}

// Sequential on purpose: each read is an upstream call through the host.
async function loadResets() {
  if (state.resetsBusy) return;
  state.resetsBusy = true;
  try {
    for (const c of state.snap?.credentials ?? []) {
      if ((c.provider !== 'claude' && c.provider !== 'codex') || c.disabled || c.status === 'pending' || limited(c)) continue;
      const r = state.resets[c.auth_index];
      if (r && Date.now() - r.at < RESET_TTL_MS) continue;
      state.resets[c.auth_index] = await readResets(c);
      render();
    }
  } catch (err) {
    if (err instanceof AuthError) requireKey();
  } finally {
    state.resetsBusy = false;
  }
}

async function claimCodex(c) {
  const header = await codexHeaders(c.auth_index);
  const r = await upstream(c.auth_index, 'POST', CODEX_CONSUME_URL, header, JSON.stringify({ redeem_request_id: uuid() }));
  if (r.status < 200 || r.status >= 300) throw new Error(`HTTP ${r.status}`);
  const code = isRec(r.body) ? r.body.code : undefined;
  if (code !== 'reset' && code !== 'already_redeemed') throw new Error('not_confirmed');
  try {
    // Redeeming does not clear the host's cooldown on this credential; CPAMC does it right after.
    const res = await mgmt('/v8/management/routing/cooldown/reset', { auth_index: c.auth_index });
    if (res.status !== 'ok' || res.auth_index !== c.auth_index) throw new Error('bad response');
  } catch (err) {
    if (err instanceof AuthError) throw err;
    throw new Error('cooldown_failed');
  }
  return 'reset';
}

const RESET_MESSAGES = {
  reset: 'Quota reset',
  already_used: 'That reset was already applied',
  not_limited: 'Not at a limit — nothing to reset',
  cooldown: 'Resets are on cooldown',
  ineligible: 'This account is not eligible for resets',
  unavailable: 'Reset unavailable',
  rate_limited: 'Rate limited — try again later',
  auth_error: 'Authorisation refused upstream',
  blocked: 'No usable reset right now',
  expired: 'Retry window expired; the earlier claim stays unresolved',
  identity: 'Organisation changed since the earlier claim',
  unknown: 'Outcome unknown — use Retry reset within 10 minutes to resend the same request',
  not_confirmed: 'Upstream did not confirm the reset',
  cooldown_failed: 'Credit redeemed, but clearing the cooldown failed — clear it from CPAMC',
};

async function useReset(c) {
  const ai = c.auth_index;
  if (state.busy.has(ai)) return;
  const pending = state.ops[ai] && !state.ops[ai].code;
  const name = maskEmail(c.name, c.email);
  const ask = pending
    ? `A previous reset request for ${name} may or may not have gone through. Retry with the same request ID?`
    : `Use one ${c.provider === 'codex' ? 'Codex rate-limit reset credit' : 'Claude reset grant'} on ${name}? This spends a reset.`;
  if (!confirm(ask)) return;
  state.busy.add(ai);
  render();
  let note;
  try {
    const code = c.provider === 'codex' ? await claimCodex(c) : await claimClaude(c);
    note = RESET_MESSAGES[code] || code;
  } catch (err) {
    if (err instanceof AuthError) { state.busy.delete(ai); return requireKey(); }
    note = RESET_MESSAGES[err.message] || `Reset failed: ${err.message}`;
  }
  state.notes[ai] = note;
  delete state.resets[ai];
  state.busy.delete(ai);
  await refreshOne(c);
  loadResets();
}

/* ---------- rendering ---------- */

const icon = (name) => `<span class="icon">${ICONS[name]}</span>`;

function visibleCreds() {
  const list = (state.snap?.credentials ?? []).filter((c) => state.tab === 'all' || c.provider === state.tab);
  if (state.sort === 'ledger') return list;
  const score = (c) => {
    const rems = c.windows.map(remaining).filter((r) => r !== null);
    const resets = c.windows.map((w) => w.reset_at).filter(Boolean);
    return state.sort === 'lowest' ? (rems.length ? Math.min(...rems) : Infinity) : resets.length ? Math.min(...resets) : Infinity;
  };
  return [...list].sort((a, b) => score(a) - score(b));
}

// Window keys in first-seen order across a provider's credentials.
function windowKeys(creds) {
  const seen = new Map();
  for (const c of creds) for (const w of c.windows) if (!seen.has(w.key)) seen.set(w.key, w.label);
  return [...seen];
}

function aggregate(creds, key) {
  const wins = creds.map((c) => c.windows.find((w) => w.key === key) || null);
  const loaded = wins.filter((w) => w && remaining(w) !== null);
  const resets = loaded.map((w) => w.reset_at).filter((r) => r && r > Date.now());
  return {
    total: loaded.reduce((s, w) => s + remaining(w), 0),
    max: creds.length * 100,
    any: loaded.length > 0,
    count: loaded.length,
    segments: wins.map((w) => (w ? remaining(w) : null)),
    reset: resets.length ? Math.min(...resets) : null,
  };
}

const ACCENT = { claude: '#D97757', codex: '#7A9DFF', opencode: 'var(--text-2)' };
const APP_NAMES = { 'claude-cli': 'Claude Code', codex: 'Codex CLI', opencode: 'OpenCode' };
const appName = (ua) => APP_NAMES[ua.toLowerCase()] || ua;
const listJoin = (a) => (a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const SVG_SHIELD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
const SVG_PAUSE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>';

// Compact countdown for dense lists: "in 40 min", "in 5 h", "in 6 d".
function short(ms, now = Date.now()) {
  const min = Math.round((ms - now) / 60000);
  if (min <= 0) return 'now';
  if (min < 60) return `in ${min} min`;
  const h = Math.round(min / 60);
  return h < 48 ? `in ${h} h` : `in ${Math.round(h / 24)} d`;
}

function donut(rem, size = 84) {
  const half = size / 2, r = half - 6, c = 2 * Math.PI * r;
  const arc = rem > 0 ? `<circle cx="${half}" cy="${half}" r="${r}" fill="none" stroke="${tone(rem)}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${((c * rem) / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${half} ${half})"/>` : '';
  return `<svg class="donut" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${rem == null ? 'no data' : `${Math.round(rem)}% left`}"><circle cx="${half}" cy="${half}" r="${r}" fill="none" stroke="var(--track)" stroke-width="8"/>${arc}</svg>`;
}

const isLow = (c) => c.windows.some((w) => w.key !== 'credits' && remaining(w) !== null && remaining(w) < (state.snap.settings.alert_below_percent || 20));
// The server stops calling a rate-limited account until retry_at; the numbers shown are the last good ones.
const limited = (c) => c.retry_at > Date.now();
const issueHtml = (c, prefix = '') => limited(c)
  ? `<div class="issue wait">${prefix}${esc(c.error.replace(/\.$/, ''))} · showing the last known numbers, next check ${esc(short(c.retry_at, Date.now()))}</div>`
  : `<div class="issue">${prefix}${esc(c.error)}</div>`;
function credStatus(c) {
  if (c.disabled) return ['off', 'Disabled'];
  if (c.login) return ['err', c.provider === 'opencode' ? 'Key rejected' : 'Sign in again'];
  if (limited(c)) return ['warn', 'Rate limited'];
  if (c.status === 'error') return ['err', 'Error'];
  if (c.status === 'pending') return ['off', 'Waiting'];
  if (c.reserved) return ['warn', 'In reserve'];
  if (isLow(c)) return ['warn', 'Running low'];
  return ['ok', 'Healthy'];
}
function providerStatus(creds) {
  const errors = creds.filter((c) => c.status === 'error' && !limited(c)).length;
  if (errors) return ['err', plural(errors, 'issue')];
  if (creds.some(limited)) return ['warn', 'Rate limited'];
  const low = creds.filter((c) => c.status === 'ok' && isLow(c)).length;
  if (low) return ['warn', `${low} running low`];
  if (creds.every((c) => c.status === 'pending' || c.disabled)) return ['off', 'Waiting'];
  return ['ok', 'Healthy'];
}

function renderCard(p, creds, now) {
  const keys = windowKeys(creds.map((c) => ({ windows: plainWindows(c) })));
  const n = creds.length;
  const [st, stText] = providerStatus(creds);
  const head = `<header class="pc-head"><span class="pc-name">${icon(p.id)}${esc(p.label)}<small>${plural(n, 'account')}</small></span><span class="pill dot ${st}">${esc(stText)}</span></header>`;
  const issues = creds.filter((c) => c.status === 'error').map((c) => issueHtml(c, n > 1 ? `${esc(maskEmail(c.name, c.email))}: ` : '')).join('');
  const open = `<section class="surface pcard" style="--accent:${ACCENT[p.id]}">${head}`;
  if (!keys.length) {
    const why = creds.some((c) => c.status === 'pending') ? 'Waiting for the first check…' : 'The provider returned no limits.';
    return `${open}<div class="pc-hero">${donut(null)}<div class="pc-hero-text"><div class="eyebrow">No quota data</div><div class="sub">${why}</div></div></div>${issues}</section>`;
  }
  const [k0, l0] = keys[0];
  const a = aggregate(creds, k0);
  const avg = a.count ? a.total / a.count : null;
  const multi = n > 1;
  const segs = multi ? `<div class="segments" title="One segment per account">${a.segments.map((r) => `<div class="seg"><i style="width:${r ?? 0}%;background:${tone(r)}"></i></div>`).join('')}</div>` : '';
  const across = multi && a.count ? `${Math.round(a.total)}% of ${a.max}% across ${n} accounts · ` : '';
  const hero = `<div class="pc-hero">${donut(avg)}<div class="pc-hero-text">
      <div class="eyebrow">${esc(l0)}</div>
      <div class="hero-num">${avg === null ? '--' : `${Math.round(avg)}%`}<span>${multi ? 'left on average' : 'left'}</span></div>
      <div class="sub">${across}${a.reset ? `resets ${relative(a.reset)} · ${absolute(a.reset)}` : 'no reset pending'}</div>${segs}</div></div>`;
  const rows = keys.slice(1).map(([k, label]) => {
    const o = aggregate(creds, k);
    const r = o.count ? o.total / o.count : null;
    return `<li title="${o.reset ? `resets ${absolute(o.reset)}` : ''}"><span class="lbl">${esc(label)}</span><span class="minibar"><i style="width:${r ?? 0}%;background:${tone(r)}"></i></span><span class="pct">${r === null ? '--' : `${Math.round(r)}%`}</span><span class="when">${o.reset ? short(o.reset, now) : '—'}</span></li>`;
  }).join('');
  const list = rows ? `<ul class="pc-list"><li class="cap"><span>Other limits</span><span></span><span class="pct">Left</span><span class="when">Resets</span></li>${rows}</ul>` : '';
  return `${open}${hero}${list}${moneyRows(creds)}${issues}</section>`;
}

function sparkline(points, w, now) {
  if (!points) return '';
  const span = Math.min(w.period_s || 7 * 86400, 7 * 86400) * 1000;
  const from = now - span;
  const pts = points.filter((p) => p[0] >= from && p[1] != null);
  if (pts.length < 2) return '';
  const W = 64, H = 18;
  const d = pts.map(([t, u]) => `${(((t - from) / span) * W).toFixed(1)},${(H - 1 - (clamp(u) / 100) * (H - 2)).toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1][1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="usage over the last days"><polyline points="${d}" fill="none" stroke="${tone(clamp(100 - last))}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function renderWindow(c, w, now) {
  const r = remaining(w);
  const pc = pace(w, now);
  const detail = pc ? `${Math.round(w.used)}% used with ${Math.round(pc.elapsed * 100)}% of the window gone` : '';
  const chip = pc?.tone === 'warn' ? `<span class="chip-pace warn" title="${esc(detail)}">Using fast · ${pc.ratio.toFixed(1)}×</span>` : pc?.tone === 'low' ? `<span class="chip-pace low" title="${esc(detail)}">Easy pace</span>` : '';
  const points = state.history[`${c.auth_index}|${w.key}`];
  const hit = project(points, w, now);
  const when = w.used === 0 && !w.reset_at ? 'Not started yet' : w.reset_at ? `Resets <b>${short(w.reset_at, now)}</b>` : '—';
  return `<div class="tile" title="${w.reset_at ? `Resets ${absolute(w.reset_at)}` : ''}">
    <div class="t-top t-label">${esc(w.label)}</div>
    <div class="t-mid"><div class="t-num"${r !== null && r < 30 ? ` style="color:${tone(r)}"` : ''}>${r === null ? '--' : `${Math.round(r)}%`}<span>left</span></div>${chip}</div>
    <div class="track"><i style="width:${r ?? 0}%;background:${tone(r)}"></i></div>
    <div class="t-foot"><span>${when}</span>${sparkline(points, w, now)}</div>
    ${hit ? `<div class="proj">Runs out ~${dayTime(hit)}, before it resets</div>` : ''}
  </div>`;
}

function resetInfo(c) {
  const r = state.resets[c.auth_index];
  if (!r || r.error) return { line: '', action: '' };
  if (c.provider === 'codex') {
    if (!(r.count > 0)) return { line: '', action: '' };
    const next = r.expires ? ` · next expires ${relative(r.expires)}` : '';
    return { line: `Reset credits: <strong>${r.count}</strong>${next}`, action: 'Use reset' };
  }
  const pending = state.ops[c.auth_index] && !state.ops[c.auth_index].code;
  if (!(r.count > 0) && !pending) return { line: '', action: '' };
  return { line: `Reset grants: <strong>${r.count}</strong>`, action: pending ? 'Retry reset' : r.grant ? 'Use reset' : '' };
}

function loginHtml(c) {
  const oauth = c.provider !== 'opencode';
  const fix = oauth
    ? `<button class="btn small" data-open="oauth">Sign in again</button><button class="btn small" data-off="${esc(c.auth_index)}">Turn off</button>`
    : '<button class="btn small" data-open="ai-providers">Edit key</button>';
  return `<div class="issue relogin"><span><b>${oauth ? 'Login expired' : 'API key rejected'}</b> · ${esc(c.login_reason || '')}</span><div class="btn-row">${fix}</div></div>`;
}

// Live traffic through the proxy: last 24 h of outcomes, the last failure, and whether routing skips it.
function healthHtml(c, now) {
  const h = c.health;
  if (!h || c.disabled) return [];
  const d = h.day || {};
  const out = [];
  if (d.requests) {
    const kinds = [d.rate_limited && `${d.rate_limited} × 429`, d.auth_failed && `${d.auth_failed} × 401/403`, d.server_errors && `${d.server_errors} × 5xx`].filter(Boolean);
    const failed = d.failed ? ` · <span class="${d.failed / d.requests > 0.1 ? 'err' : ''}">${compact(d.failed)} failed${kinds.length ? ` (${kinds.join(', ')})` : ''}</span>` : '';
    const avg = d.timed ? ` · avg ${(d.latency_ms / d.timed / 1000).toFixed(1)} s` : '';
    out.push(`<span title="Requests through the proxy in the last 24 hours">24 h: <b>${compact(d.requests)}</b> requests${failed}${avg}</span>`);
  }
  if (h.last_fail && now - h.last_fail_at < 24 * HOUR) out.push(`<span class="muted" title="${absolute(h.last_fail_at)}">Last failure ${ago(h.last_fail_at)}: ${esc(h.last_fail)}</span>`);
  if (h.avoid_until > now) out.push(`<span class="pill warn" title="Smart routing tries this account's siblings first">Skipped by routing${h.avoid_until - now < 24 * HOUR ? ` ${short(h.avoid_until, now)}` : ''}</span>`);
  return out;
}

function renderAccount(c, now) {
  const [st, stText] = credStatus(c);
  const rs = resetInfo(c);
  const busy = state.busy.has(c.auth_index) || state.refreshing;
  let body = '';
  if (c.status === 'disabled') body = '<div class="muted">This account is disabled, so its quota is not checked.</div>';
  else if (!c.windows.length) body = c.status === 'pending' ? '<div class="muted">Waiting for the first check…</div>' : c.error ? '' : '<div class="muted">The provider returned no limits for this account.</div>';
  else body = `<div class="tiles">${plainWindows(c).map((w) => renderWindow(c, w, now)).join('')}</div>`;
  const foot = healthHtml(c, now);
  if (rs.line) foot.push(`<span>${rs.line}</span>`);
  if (state.notes[c.auth_index]) foot.push(`<span class="note">${esc(state.notes[c.auth_index])}</span>`);
  const stale = c.fetched_at && now - c.fetched_at > 3 * (state.snap.poller.interval_s || 300) * 1000;
  const updated = c.fetched_at && !c.disabled ? `<span class="${stale ? 'stale' : 'muted'}" title="${absolute(c.fetched_at)}">checked ${ago(c.fetched_at)}</span>` : '';
  const reserveTip = c.reserved ? ' title="Smart routing keeps this account\'s last quota for the reserved apps"' : '';
  const ai = esc(c.auth_index);
  const mute = `<button class="icon-btn" data-mute="${ai}" aria-pressed="${c.muted ? 'true' : 'false'}" title="${c.muted ? 'Alerts muted: listed here, not sent. Click to unmute.' : 'Mute alerts for this account'}" aria-label="${c.muted ? 'Unmute alerts' : 'Mute alerts'}">${c.muted ? ICONS.bellOff : ICONS.bell}</button>`;
  const actions = c.disabled
    ? ''
    : `${rs.action ? `<button class="btn small" data-reset="${ai}" ${busy ? 'disabled' : ''}>${rs.action}</button>` : ''}${mute}<button class="icon-btn" data-refresh="${ai}" title="Check quota now" aria-label="Check quota now" ${busy ? 'disabled' : ''}><span class="${busy ? 'spin' : ''}" style="display:inline-flex">${ICONS.refresh}</span></button>`;
  return `<article class="surface acard" style="--accent:${ACCENT[c.provider]}">
    <header class="ac-head"><div class="ac-id"><span class="ac-icon">${ICONS[c.provider]}</span><div style="min-width:0">
      <div class="ac-name">${esc(maskEmail(c.name, c.email))}</div>
      <div class="ac-meta">${c.plan ? `<span class="pill">${esc(c.plan)}</span>` : ''}<span class="pill dot ${st}"${reserveTip}>${esc(stText)}</span>${c.muted ? '<span class="pill off">Muted</span>' : ''}${updated}</div>
    </div></div><div class="ac-actions">${actions}</div></header>
    ${c.login ? loginHtml(c) : c.error ? issueHtml(c) : ''}${body}${moneyRows([c])}
    ${foot.length ? `<div class="ac-foot">${foot.join('')}</div>` : ''}
  </article>`;
}

const MODE_TEXT = {
  off: 'Off. Requests take turns between accounts the usual way.',
  'most-remaining': 'Each request goes to the account that has the most quota left.',
  'soonest-reset': "Uses up the account that resets soonest first, so its quota doesn't go to waste.",
  'use-first': 'Spends first the quota that would otherwise be lost at the next weekly reset, in the "Use first" order.',
};
const DAY_NAMES = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday', sun: 'Sunday' };
function ruleText(r) {
  const when = [r.days, r.hours].filter(Boolean).join(' ') || 'Always';
  const prov = r.provider && (PROVIDERS.find((p) => p.id === r.provider.toLowerCase())?.label || r.provider);
  const app = r.client && (r.client.startsWith('!') ? `apps other than ${appName(r.client.slice(1))}` : appName(r.client));
  const who = [prov, r.model && `model “${r.model}”`, app].filter(Boolean).join(', ');
  const what = [r.mode && (r.mode === 'off' ? 'normal rotation' : r.mode), r.reserve_floor_percent != null && `keep the last ${r.reserve_floor_percent}%`].filter(Boolean).join(', ');
  return `${when}${who ? ` · ${who}` : ''} → ${what}`;
}
const fact = (svg, html) => `<div class="fact">${svg}<span>${html}</span></div>`;

function renderRouting() {
  const { settings: s, scheduler: sc, credentials: creds } = state.snap;
  const mode = sc.mode || s.scheduler_mode;
  const on = mode !== 'off';
  const parts = [`<p class="lead">${esc(MODE_TEXT[mode] || mode)}</p>`];
  if (on) {
    const apps = listJoin((s.reserve_exempt_user_agents || []).map((u) => esc(appName(u))));
    parts.push(s.reserve_floor_percent > 0
      ? fact(SVG_SHIELD, `Each account keeps its last <b>${s.reserve_floor_percent}%</b> for <b>${apps || 'no app'}</b>. Other apps move to another account once it drops below that.`)
      : fact(SVG_SHIELD, 'No reserve: every app can use an account all the way down to 0%.'));
    const held = creds.filter((c) => c.reserved);
    if (held.length) parts.push(fact(SVG_PAUSE, `Holding back <b>${plural(held.length, 'account')}</b>: ${held.map((c) => esc(maskEmail(c.name, c.email))).join(', ')}`));
    const skipped = creds.filter((c) => c.health?.avoid_until > Date.now());
    if (skipped.length) parts.push(fact(SVG_PAUSE, `Trying others first: <b>${skipped.map((c) => esc(maskEmail(c.name, c.email))).join(', ')}</b> (failing in live traffic)`));
    const rules = s.routing_rules || [];
    if (rules.length) parts.push(`<div class="rules"><div class="hint">Rules, first match wins:</div><ol>${rules.map((r) => `<li class="${r.active ? 'on' : ''}">${esc(ruleText(r))}${r.active ? ' <span class="pill dot ok">now</span>' : ''}</li>`).join('')}</ol></div>`);
    const active = creds.filter((c) => !c.disabled);
    if (!PROVIDERS.some((p) => active.filter((c) => c.provider === p.id).length > 1)) {
      parts.push('<div class="note-box">Smart routing picks between accounts of the <b>same</b> provider. You have one account per provider, so there is nothing to choose yet. It starts working as soon as you add a second account.</div>');
    }
    parts.push(`<div class="stats"><div class="stat" title="Requests sent to an account because of its quota"><b>${sc.picks}</b><span>chosen by quota</span></div><div class="stat" title="Requests where quota was unknown or every account was held back, so the normal rotation decided"><b>${sc.fallbacks}</b><span>normal rotation</span></div></div>`);
    const lp = sc.last_pick;
    if (lp) parts.push(`<div class="hint">Last choice ${ago(lp.at)}: <b>${esc(lp.model || 'a request')}</b> went to <b>${esc(credLabel(lp.auth_index))}</b> (${esc(lp.reason)})</div>`);
  }
  parts.push('<div class="hint">Change these settings in CPAMC → Plugins → quota-ledger.</div>');
  return `<section class="surface side-card"><header><h2>Smart routing</h2><span class="pill dot ${on ? 'ok' : 'off'}">${on ? 'On' : 'Off'}</span></header>${parts.join('')}</section>`;
}

function renderUseFirst(shown, now) {
  if (!shown.some((c) => c.windows?.length)) return '';
  const plan = usePlan(shown, now);
  const many = (id) => shown.filter((c) => c.provider === id).length > 1;
  const pname = (id) => PROVIDERS.find((p) => p.id === id)?.label ?? id;
  const lbl = (w) => w.label.replace(/ limit$/i, '');
  const amount = (r) => `${r.paced ? '~' : 'up to '}${Math.round(r.lost)}%`;
  const rows = plan.slice(0, 6).map(({ c, top, rest }, i) => {
    const w = top.w;
    const caps = top.w.key.startsWith('scoped:') ? [] : rest.filter((r) => r.w.key.startsWith('scoped:'));
    const bar = (r) => {
      const willUse = Math.max(0, 100 - r.w.used - r.lost);
      return `<div class="uf-bar" title="${Math.round(r.w.used)}% used · ${Math.round(willUse)}% you'll still use · ${Math.round(r.lost)}% lost"><i class="u" style="width:${r.w.used}%"></i><i class="p" style="width:${willUse}%"></i><i class="l" style="width:${r.lost}%"></i></div>`;
    };
    const capName = (r) => lbl(r.w).replace(lbl(w), '').trim() || lbl(r.w);
    const bars = caps.length
      ? [[top, 'All models'], ...caps.map((r) => [r, capName(r)])].map(([r, name]) => `<div class="uf-part"><span>${esc(name)}</span>${bar(r)}<span>${amount(r)} lost</span></div>`).join('')
      : bar(top);
    const capNote = caps.length ? ` ${caps.map((r) => esc(capName(r))).join(', ')} also ${caps.length > 1 ? 'have their' : 'has its'} own cap inside it` : '';
    const badge = i ? '' : top.after ? `<span class="pill warn">Use after ${esc(lbl(top.after))} resets</span>` : '<span class="pill dot ok">Use now</span>';
    const who = many(c.provider) ? `<small>${esc(maskEmail(c.name, c.email))}</small>` : c.plan ? `<span class="pill">${esc(c.plan)}</span>` : '';
    const basis = top.paced ? 'at your pace so far' : "if you don't use it";
    const blocked = top.after ? `. Usable once ${esc(lbl(top.after))} resets ${short(top.after.reset_at, now)}` : '';
    const more = rest.filter((r) => !caps.includes(r)).map((r) => `${esc(lbl(r.w))} ${amount(r)} ${short(r.w.reset_at, now)}`).join(' · ');
    return `<li class="uf-row${i ? '' : ' first'}" style="--accent:${ACCENT[c.provider]}">
      <span class="uf-rank">${i + 1}</span>
      <div class="uf-main">
        <div class="uf-title">${icon(c.provider)}${esc(pname(c.provider))}${who}${badge}</div>
        <div class="uf-sub">${top.paced ? '~' : 'Up to '}<b>${Math.round(top.lost)}%</b> of the ${esc(lbl(w))} limit${caps.length ? ' (all models)' : ''} goes unused when it resets, ${basis}${blocked}.${capNote ? capNote + '.' : ''}</div>
        ${bars}
        ${more ? `<div class="uf-more">Also expiring: ${more}</div>` : ''}
      </div>
      <div class="uf-big"><b>${top.paced ? '~' : ''}${Math.round(top.lost)}%</b><span>lost ${short(w.reset_at, now)}</span></div>
    </li>`;
  }).join('');
  const s = state.snap.settings;
  const pooled = PROVIDERS.some((p) => shown.filter((c) => c.provider === p.id && !c.disabled).length > 1);
  const tip = pooled && s.scheduler_mode !== 'use-first'
    ? '<div class="uf-more">Tip: set Smart routing to <b>use-first</b> and requests follow this order between accounts of the same provider automatically.</div>' : '';
  return `<section class="surface uf"><header><h2>Use first</h2><span class="hint">Quota you don't use before a limit resets is lost. Spend in this order: what expires soonest first.</span></header>
    ${rows ? `<ol class="uf-list">${rows}</ol>
    <div class="uf-key"><span><i style="background:color-mix(in srgb, var(--text-3) 55%, transparent)"></i>used</span><span><i style="background:var(--green);opacity:.7"></i>you'll still use at this pace</span><span><i style="background:var(--warn)"></i>lost at reset</span><span>% are of each plan's own limit</span></div>`
    : '<div class="muted">Nothing at risk: at your pace so far, every account uses its quota before it resets.</div>'}${tip}</section>`;
}

function renderComingBack(shown, now) {
  const items = timeline(shown, now).slice(0, 8);
  const label = (id) => PROVIDERS.find((p) => p.id === id)?.label ?? id;
  const many = (id) => shown.filter((c) => c.provider === id).length > 1;
  const rows = items
    .map((i) => `<li title="${absolute(i.at)}"><span class="icon">${ICONS[i.provider]}</span><span><span class="plus">+${i.restore}%</span> ${esc(label(i.provider))} · ${esc(i.label.replace(/ limit$/i, ''))}${many(i.provider) ? `<small>${esc(maskEmail(i.name, i.email))}</small>` : ''}</span><span class="time">${short(i.at, now)}</span></li>`)
    .join('');
  return `<section class="surface side-card"><header><h2>Coming back</h2><span class="hint">quota restored at the next resets</span></header>
    ${rows ? `<ul class="list">${rows}</ul>` : '<div class="muted">Nothing used yet, so no resets are pending.</div>'}</section>`;
}

const ALERT_KIND = {
  below: ['var(--yellow)', 'Running low'], reset: ['var(--green)', 'Reset'], error: ['var(--red)', 'Error'], recovered: ['var(--green)', 'Recovered'],
  runout: ['var(--yellow)', 'Running out'], login: ['var(--red)', 'Login'], traffic: ['var(--yellow)', 'Rate limited'],
};
function renderAlerts(count) {
  const s = state.snap.settings;
  const canAsk = 'Notification' in window && Notification.permission === 'default';
  const denied = 'Notification' in window && Notification.permission === 'denied';
  const list = [...state.alerts].reverse().slice(0, 8);
  const rows = list.length
    ? `<ul class="list">${list.map((e) => {
        const [color, name] = ALERT_KIND[e.kind] || ['var(--text-3)', e.kind];
        return `<li><span class="event-dot" style="background:${color}"></span><span>${esc(e.message || e.label || '')}<small>${esc(name)} · ${esc(credLabel(e.auth_index))} · ${ago(e.at)}${e.muted ? ' · muted' : ''}</small></span><button class="x-btn" data-dismiss="${esc(eventKey(e))}" title="Dismiss" aria-label="Dismiss">×</button></li>`;
      }).join('')}</ul>`
    : `<div class="muted">All quiet. A warning appears here when an account drops below ${s.alert_below_percent}%${s.alert_run_out ? ' or is about to run out before it resets' : ''}, a login expires, or a check fails.</div>`;
  const sched = s.webhook_configured ? [
    s.quiet_hours ? `Webhook quiet ${esc(s.quiet_hours)}${s.quiet_now ? ' <b>(quiet now)</b>' : ''}` : '',
    s.digest_day !== 'off' ? `Weekly digest ${DAY_NAMES[s.digest_day]} ${pad(s.digest_hour)}:00${s.digest_at ? `, last sent ${ago(s.digest_at)}` : ''}` : '',
  ].filter(Boolean).join(' · ') : '';
  const buttons = [
    canAsk ? '<button class="btn small" data-action="notify">Enable notifications</button>' : '',
    denied ? '<span class="hint">Notifications are blocked in this browser.</span>' : '',
    s.webhook_configured ? '<button class="btn small" data-action="webhook">Test webhook</button>' : '',
    `<button class="btn small" data-action="digest">${state.digest ? 'Hide digest' : 'Preview digest'}</button>`,
    s.webhook_configured ? '<button class="btn small" data-action="digest-send">Send digest now</button>' : '',
    state.webhookNote ? `<span class="hint">${esc(state.webhookNote)}</span>` : '',
  ].join('');
  const clear = list.length ? '<button class="btn small" data-dismiss="*">Clear all</button>' : `<span class="pill dot ${count ? 'warn' : 'ok'}">${count ? `${count} running low` : 'All good'}</span>`;
  return `<section class="surface side-card"><header><h2>Alerts</h2>${clear}</header>${rows}${sched ? `<div class="hint">${sched}</div>` : ''}<div class="btn-row">${buttons}</div>${state.digest ? `<pre class="snip">${esc(state.digest)}</pre>` : ''}</section>`;
}

// What was really left unused at each reset of a weekly or longer window (the server records it at the reset).
function renderWaste(shown, now) {
  if (!state.waste || !shown.some((c) => c.windows?.length)) return '';
  const ids = new Set(shown.map((c) => c.auth_index));
  const groups = new Map();
  for (const e of state.waste) {
    if (!ids.has(e.auth_index) || e.period_s < 86400) continue;
    const k = `${e.auth_index}|${e.window}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  }
  const many = (id) => shown.filter((c) => c.provider === id).length > 1;
  const pname = (id) => PROVIDERS.find((p) => p.id === id)?.label ?? id;
  const lbl = (s) => s.replace(/ limit$/i, '');
  const rows = [...groups.values()].map((evs) => {
    const last = evs[evs.length - 1];
    const c = credByIndex(last.auth_index);
    const avg = evs.reduce((sum, e) => sum + e.unused, 0) / evs.length;
    const bars = evs.slice(-8).map((e) => `<i style="height:${Math.max(4, e.unused)}%" title="${absolute(e.at)}: ${Math.round(e.unused)}% unused"></i>`).join('');
    return `<li class="ws-row">${icon(last.provider)}<div class="ws-main"><div class="uf-title">${esc(pname(last.provider))} · ${esc(lbl(last.label))}${many(last.provider) && c ? `<small>${esc(maskEmail(c.name, c.email))}</small>` : ''}</div><div class="uf-sub">Last reset ${ago(last.at)}: <b>${Math.round(last.unused)}%</b> left unused · average ${Math.round(avg)}% over ${plural(evs.length, 'reset')}</div></div><div class="ws-bars" aria-label="unused share at the last resets">${bars}</div></li>`;
  }).join('');
  const next = shown.flatMap((c) => (c.disabled ? [] : c.windows).filter((w) => w.key !== 'credits' && w.reset_at > now && isLong(w, now)).map((w) => ({ c, w })))
    .sort((a, b) => a.w.reset_at - b.w.reset_at)[0];
  const empty = next
    ? `Nothing recorded yet. The first weekly reset is ${esc(pname(next.c.provider))} ${esc(lbl(next.w.label))} ${short(next.w.reset_at, now)}; after each reset this shows how much was left unused.`
    : 'Nothing recorded yet.';
  return `<section class="surface uf"><header><h2>Lost at reset</h2><span class="hint">What was actually left unused when each weekly or monthly limit reset, last 8 weeks.</span></header>${rows ? `<ul class="uf-list">${rows}</ul>` : `<div class="muted">${empty}</div>`}</section>`;
}

function renderIntegrations() {
  const base = `${location.origin}/v0/management/quota-ledger`;
  const b = state.bar;
  return `<section class="surface side-card"><header><h2>Status bar &amp; metrics</h2></header>
    ${b ? `<div class="bar-preview ${esc(b.class)}" title="${esc(b.tooltip)}">${esc(b.text || '—')}</div>` : ''}
    <div class="hint">Waybar <b>custom</b> module (JSON with text, tooltip, class), or <b>?format=text</b> for plain text:</div>
    <pre class="snip">curl -s -H "Authorization: Bearer $KEY" ${esc(base)}/bar</pre>
    <div class="hint">Prometheus scrape job:</div>
    <pre class="snip">metrics_path: /v0/management/quota-ledger/metrics
authorization: { credentials: $KEY }
static_configs: [{ targets: ["${esc(location.host)}"] }]</pre></section>`;
}

function renderUsage() {
  const u = state.usage;
  const toggle = `<div class="seg-ctl">${[24, 168].map((h) => `<button class="${state.usageHours === h ? 'on' : ''}" data-usage="${h}">${h === 24 ? '24 hours' : '7 days'}</button>`).join('')}</div>`;
  let table = '<div class="muted">Loading…</div>';
  if (u && u.hours === state.usageHours) {
    const groups = groupUsage(u.rows || []);
    const cells = (t) => USAGE_FIELDS.map((f) => `<td class="n">${compact(t[f])}</td>`).join('');
    const body = groups
      .map((a) => {
        const kids = a.kids
          .map((c) => `<tr class="l1"><td>${esc(c.key)}</td>${cells(c.t)}</tr>${c.kids.map((m) => `<tr class="l2"><td>${esc(m.key)}</td>${cells(m.t)}</tr>`).join('')}`)
          .join('');
        return `<tr class="l0"><td>${esc(credLabel(a.key))}</td>${cells(a.t)}</tr>${kids}`;
      })
      .join('');
    table = groups.length
      ? `<div class="table-wrap"><table class="usage"><thead><tr><th>Account · client key · model</th><th class="n">Requests</th><th class="n">Failed</th><th class="n">Input</th><th class="n">Output</th><th class="n">Cache read</th><th class="n">Cache write</th></tr></thead><tbody>${body}</tbody></table></div>`
      : '<div class="muted">No requests went through the proxy in this period.</div>';
  }
  return `<section class="surface usage-card"><div class="section-head"><div><h2>Who used what</h2><div class="hint">Requests per account, split by client key and model.</div></div>${toggle}</div>${table}</section>`;
}

function render() {
  if (document.activeElement?.id === 'sort') { state.dirty = true; return; } // an open dropdown would close
  state.dirty = false;
  const app = document.getElementById('app');
  const title = '<h1>Quota Ledger</h1>';
  if (state.needKey) {
    document.title = 'Quota Ledger';
    app.innerHTML = `${title}<form class="login" id="login"><div><strong>Management key</strong></div>
      <div class="muted">Enter the CLIProxyAPI management key. It is kept in this tab's session storage only.</div>
      <input type="password" id="key" autocomplete="current-password" autofocus required>
      <button class="btn primary" type="submit">Connect</button></form>`;
    return;
  }
  if (!state.snap) {
    app.innerHTML = `${title}<div class="empty" style="margin-top:24px">${state.loadError ? `<span class="err">${esc(state.loadError)}</span>` : 'Loading…'}</div>`;
    return;
  }
  const y = window.scrollY;
  const now = Date.now();
  const { poller, settings } = state.snap;
  const creds = state.snap.credentials;
  const loaded = creds.filter((c) => c.status === 'ok').length;
  const below = belowCount(creds, settings.alert_below_percent);
  setTitle(below);
  const counts = Object.fromEntries(PROVIDERS.map((p) => [p.id, creds.filter((c) => c.provider === p.id).length]));
  const tabs = [{ id: 'all', label: 'All' }, ...PROVIDERS]
    .map((t) => `<button class="tab ${state.tab === t.id ? 'active' : ''}" data-tab="${t.id}">${icon(t.id)}${esc(t.label)}<span class="count">${t.id === 'all' ? creds.length : counts[t.id]}</span></button>`)
    .join('');
  const shown = visibleCreds();
  const providers = PROVIDERS.filter((p) => shown.some((c) => c.provider === p.id));
  const overview = providers.length ? `<div class="overview">${providers.map((p) => renderCard(p, shown.filter((c) => c.provider === p.id), now)).join('')}</div>` : '';
  const sort = `<select id="sort" aria-label="Order accounts">
      <option value="ledger" ${state.sort === 'ledger' ? 'selected' : ''}>Default order</option>
      <option value="lowest" ${state.sort === 'lowest' ? 'selected' : ''}>Lowest quota first</option>
      <option value="reset" ${state.sort === 'reset' ? 'selected' : ''}>Soonest reset first</option>
    </select>`;
  const accounts = shown.length
    ? `<section><div class="section-head"><h2>Accounts <span class="count">${shown.length}</span></h2>${sort}</div><div class="accounts">${shown.map((c) => renderAccount(c, now)).join('')}</div></section>`
    : '';
  const empty = creds.length
    ? providers.length ? '' : '<div class="empty">No accounts for this provider.</div>'
    : '<div class="empty">No Claude, Codex or OpenCode accounts yet. Add Claude/Codex via <strong>OAuth Login</strong>, or an OpenCode Go key as an OpenAI-compatible provider with base URL <code>https://opencode.ai/zen/go/v1</code>.</div>';
  const polled = poller.running ? ' · checking…' : poller.last_run_at ? ` · checked ${ago(poller.last_run_at)}` : '';
  const problems = (settings.problems || []).map((p) => ` · <span class="err">config ignored: ${esc(p)}</span>`).join('');
  const errors = `${poller.error ? ` · <span class="err">poller: ${esc(poller.error)}</span>` : ''}${poller.webhook_error ? ` · <span class="err">${esc(poller.webhook_error)}</span>` : ''}${state.fetchError ? ` · <span class="err">state unavailable: ${esc(state.fetchError)}</span>` : ''}${problems}`;

  app.innerHTML = `
    <div class="head">
      <div>${title}<div class="meta">${plural(creds.length, 'account')} · <span class="ok">${loaded} loaded</span>${polled}${errors}</div></div>
      <div class="actions">
        <button class="btn" data-action="emails">${state.showEmails ? 'Hide emails' : 'Show emails'}</button>
        <button class="btn primary" data-action="refresh-all" ${state.refreshing ? 'disabled' : ''}><span class="${state.refreshing ? 'spin' : ''}" style="display:inline-flex">${ICONS.refresh}</span>Refresh</button>
      </div>
    </div>
    <div class="bar-row"><div class="tabs">${tabs}</div></div>
    <div class="layout">
      <div class="main-col">${renderUseFirst(shown, now)}${renderWaste(shown, now)}${overview}${accounts}${empty}${renderUsage()}</div>
      <aside class="side">${renderRouting()}${renderComingBack(shown, now)}${renderAlerts(below)}${renderIntegrations()}</aside>
    </div>`;
  window.scrollTo(0, y);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('button');
  if (!el) return;
  const act = el.dataset.action;
  if (el.dataset.tab) { state.tab = el.dataset.tab; render(); }
  else if (el.dataset.refresh) { const c = credByIndex(el.dataset.refresh); if (c) refreshOne(c); }
  else if (el.dataset.reset) { const c = credByIndex(el.dataset.reset); if (c) useReset(c); }
  else if (el.dataset.mute) { const c = credByIndex(el.dataset.mute); if (c) setMuted(c, !c.muted); }
  else if (el.dataset.off) { const c = credByIndex(el.dataset.off); if (c) turnOff(c); }
  else if (el.dataset.open) openCpamc(el.dataset.open);
  else if (el.dataset.dismiss) dismiss(el.dataset.dismiss);
  else if (el.dataset.usage) { state.usageHours = Number(el.dataset.usage); render(); loadUsage(); }
  else if (act === 'emails') { state.showEmails = !state.showEmails; render(); }
  else if (act === 'refresh-all') refreshAll();
  else if (act === 'notify') Notification.requestPermission().then(render);
  else if (act === 'webhook') {
    mgmt(`${API}alerts/test`, {})
      .then((r) => { state.webhookNote = r.ok ? 'Test sent.' : `Webhook failed: ${r.error || 'unknown error'}`; })
      .catch((err) => { state.webhookNote = err.message; })
      .finally(render);
  } else if (act === 'digest') {
    if (state.digest) { state.digest = ''; render(); }
    else mgmt(`${API}digest`).then((r) => { state.digest = r.text; }).catch((err) => { state.webhookNote = err.message; }).finally(render);
  } else if (act === 'digest-send') {
    mgmt(`${API}digest`, {})
      .then((r) => { state.webhookNote = r.ok ? 'Digest sent.' : `Digest failed: ${r.error || 'unknown error'}`; })
      .catch((err) => { state.webhookNote = err.message; })
      .finally(render);
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id !== 'sort') return;
  state.sort = e.target.value;
  e.target.blur();
  render();
});
document.addEventListener('focusout', (e) => {
  if (e.target.id === 'sort' && state.dirty) render();
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'login') return;
  e.preventDefault();
  state.key = document.getElementById('key').value.trim();
  sessionStorage.setItem('quota-ledger:key', state.key);
  state.needKey = false;
  loadAll();
});

/* ---------- theme: follow CPAMC's data-theme on the parent document ---------- */

function syncTheme() {
  let theme = null;
  try {
    if (window.parent !== window) theme = window.parent.document.documentElement.getAttribute('data-theme');
    else theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : null;
  } catch { /* cross-origin parent */ }
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
}
syncTheme();
if (window.parent !== window) document.documentElement.classList.add('embedded');
try {
  if (window.parent !== window) new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch { /* cross-origin parent */ }

state.key = sessionStorage.getItem('quota-ledger:key') || cpamcKey();
if (state.key) loadAll();
else requireKey();
setInterval(tick, STATE_POLL_MS); // server polls upstream; we only re-read its state
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
setInterval(() => { if (!state.needKey && !document.hidden) render(); }, 60000); // keep "in N min" labels fresh
</script>
</body>
</html>
