name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [quota-ledger, token-trim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - run: go vet ./... && go test ./...
        working-directory: ${{ matrix.plugin }}
